<app-dialog-header icon="las la-microphone-alt" title="Ingresar Letra / Sincronizar con IA"></app-dialog-header>

<mat-dialog-content class="enter-lyrics-dialog-content">
    <div class="track-header-info d-flex justify-content-between align-items-center mb-2">
        <div class="overflow-hidden mr-2">
            <div class="font-14px font-weight-bold ellipsis">{{ trackTitle }}</div>
            <div class="secondary-text font-12px ellipsis" *ngIf="trackArtist">{{ trackArtist }}</div>
        </div>
        <button
            type="button"
            mat-button
            class="btn-clean-lyrics font-11px px-2 py-0 border rounded flex-shrink-0"
            (click)="cleanLyrics()"
            [disabled]="!hasLyricsText || isAligning"
            matTooltip="Eliminar encabezados como [Verse 1], [Chorus] y datos de artista/título"
        >
            <i class="las la-broom mr-1"></i> Limpiar etiquetas
        </button>
    </div>

    <div class="textarea-container">
        <textarea
            class="lyrics-textarea"
            [(ngModel)]="lyricsText"
            [disabled]="isAligning || isPublishing"
            placeholder="Pega aquí la letra que encontraste en Google (línea por línea)..."
            rows="12"
        ></textarea>
    </div>

    <!-- Opción de compartir con la comunidad -->
    <div class="d-flex align-items-center justify-content-between mt-2 flex-wrap">
        <label class="font-11px secondary-text d-flex align-items-center mb-0 pointer" matTooltip="Al sincronizar o guardar, se compartirá automáticamente con la comunidad abierta de LRCLIB">
            <input type="checkbox" [(ngModel)]="shareWithCommunity" class="mr-1" [disabled]="isAligning || isPublishing">
            <span>Compartir con la comunidad abierta (LRCLIB)</span>
        </label>
        <button
            type="button"
            mat-button
            class="btn-publish-now font-10px px-2 py-0 border rounded pointer"
            (click)="publishCurrentLyricsToLrclibAsync()"
            [disabled]="!hasLyricsText || isAligning || isPublishing"
            matTooltip="Subir esta versión de texto ahora mismo a LRCLIB"
        >
            <i class="las la-cloud-upload-alt mr-1"></i> Subir a LRCLIB ahora
        </button>
    </div>

    <!-- Indicador de progreso de IA o publicación -->
    <div *ngIf="isAligning || isPublishing" class="status-box d-flex align-items-center mt-2 p-2 rounded">
        <mat-spinner [diameter]="22" class="mr-2"></mat-spinner>
        <span class="font-12px">{{ statusMessage }}</span>
    </div>

    <!-- Mensaje de éxito de publicación -->
    <div *ngIf="publishSuccessMessage" class="status-box text-success d-flex align-items-center mt-2 p-2 rounded font-12px">
        <i class="las la-check-circle mr-1 font-14px"></i> {{ publishSuccessMessage }}
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage" class="error-box mt-2 p-2 rounded font-12px text-danger">
        <i class="las la-exclamation-triangle mr-1"></i> {{ errorMessage }}
    </div>
</mat-dialog-content>

<mat-dialog-actions class="d-flex justify-content-between align-items-center pt-2">
    <div>
        <app-transparent-button (click)="cancel()" [ngClass]="{ inactive: isAligning }">
            {{ 'cancel' | translate }}
        </app-transparent-button>
    </div>

    <div class="d-flex align-items-center">
        <!-- Guardar plano -->
        <app-transparent-button
            class="mr-2"
            [ngClass]="{ inactive: !hasLyricsText || isAligning }"
            (click)="savePlainLyricsAsync()"
            matTooltip="Guardar la letra sin análisis de IA"
        >
            <i class="las la-save mr-1"></i> Guardar normal
        </app-transparent-button>

        <!-- Sincronizar IA con Karaokero -->
        <app-accent-button
            [ngClass]="{ inactive: !hasLyricsText || isAligning }"
            (click)="syncWithAiAsync()"
            matTooltip="Escuchar la música y sincronizar los tiempos línea por línea con IA (Karaokero)"
        >
            <i class="las la-magic mr-1"></i> Sincronizar con IA
        </app-accent-button>
    </div>
</mat-dialog-actions>
